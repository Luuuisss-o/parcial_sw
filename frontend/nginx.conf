server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Sin esto, nginx buferea la respuesta del backend antes de mandarla
        # al cliente -- para requests REST normales no se nota (la respuesta
        # completa llega de una y se reenvia junta), pero en el WebSocket de
        # colaboracion los mensajes del backend (el "connected" inicial, los
        # cursores en vivo, los broadcasts de cambios) son chicos y salteados
        # en el tiempo, y quedaban retenidos en el buffer de nginx en vez de
        # reenviarse al instante -- el cliente nunca los recibia.
        proxy_buffering off;
        # El default de nginx (60s) corta antes de que /vision/detect termine
        # sus reintentos contra Gemini (backoff + fallback de modelo puede
        # tardar bastante mas de un minuto en el peor caso): 100s da margen
        # por debajo del timeout de 90s que ya tiene el cliente Axios, asi
        # nginx no interrumpe una respuesta que el backend esta por mandar.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
    }
    # Modelo de IA personalizado (Fase 2): el notebook de Colab lo sube
    # (~0.8-1.1 GB) y los celulares lo descargan. Sin esto, nginx corta la
    # subida en su limite por defecto (1 MB) y en 100 s.
    location /api/models/ {
        proxy_pass http://backend:8000/models/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
